services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scriptcast
      POSTGRES_PASSWORD: scriptcast
      POSTGRES_DB: scriptcast
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scriptcast"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://scriptcast:scriptcast@db:5432/scriptcast
      SYNC_DATABASE_URL: postgresql+psycopg://scriptcast:scriptcast@db:5432/scriptcast
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=info --pool=solo
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://scriptcast:scriptcast@db:5432/scriptcast
      SYNC_DATABASE_URL: postgresql+psycopg://scriptcast:scriptcast@db:5432/scriptcast
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # The UI no longer asks for the token, so the deployment supplies it.
      # Interpolated from .env by Compose — deliberately not env_file, which
      # would hand the web container the API keys it has no use for.
      NEXT_PUBLIC_APP_TOKEN: ${APP_TOKEN:-dev-local-token}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      # Host port is configurable so a busy 3000 does not block the stack.
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      # Keep node_modules and the build cache inside the container: Turbopack
      # cannot create its lockfile on a Windows bind mount.
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
